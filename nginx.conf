# This is a sample configuration snippet to include in your Nginx server block
# It explicitly denies public access to all hidden files and directories, such as .git, .env, .htaccess, etc.
# This prevents directory listing and exposure of sensitive configuration files.

server {
    # ... your existing server configuration ...

    # Explicitly deny access to hidden files/directories (those starting with a dot)
    # except for .well-known (often used for Let's Encrypt certificates)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to specific backup files
    location ~* (?:\.(?:bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)|~)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ... remaining configuration ...
}
