events {
    worker_connections 1024;
}

http {
    # Security: Disable server tokens
    server_tokens off;
    
    # Security: Limit request sizes
    client_max_body_size 10m;
    client_body_buffer_size 128k;

    server {
        listen 80;
        server_name _;

        # ============ SECURITY HEADERS ============
        
        # Prevent MIME type sniffing
        add_header X-Content-Type-Options "nosniff" always;
        
        # Prevent clickjacking attacks
        add_header X-Frame-Options "DENY" always;
        
        # XSS Protection
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Referrer Policy
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # Strict Transport Security (HSTS) - uncomment when HTTPS is enabled
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        
        # Content Security Policy - STRICT: no unsafe-inline, no unsafe-eval
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
        
        # Cache Control for all responses - no caching of sensitive data
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, private" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        
        # Permissions Policy (formerly Feature Policy)
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

        # ============ ROUTE CONFIGURATION ============
        
        location / {
            proxy_pass http://backend:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /;
            
            # Security: Set secure cookie flags on response
            proxy_cookie_path / "/";
            proxy_cookie_secure on;
            proxy_cookie_httponly on;
            proxy_cookie_samesite "Strict";
        }

        # ============ BLOCK HIDDEN FILES & DIRECTORIES ============
        
        # Block .git directory and all hidden directories
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Block common backup and configuration files
        location ~* (?:\.(?:bak|backup|config|sql|fla|psd|ini|log|sh|inc|swp|dist|env|orig)|~|\.git|\.env\..*|node_modules)(?:\/|$) {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Block specific dangerous file extensions
        location ~* \.(env|php|jsp|asp|aspx|cgi|exe|sh|bat|cmd|dll|conf|htaccess|htpasswd|sql|bak|orig|swp)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Block access to version control and build directories
        location ~ ^/(\.git|\.svn|\.hg|\.bzr|CVS|build|dist|node_modules|\.env)/ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ============ ADDITIONAL SECURITY ============
        
        # Disable directory listing
        autoindex off;
        
        # Block access to sensitive files in root
        location ~ ^/(README|LICENSE|Dockerfile|docker-compose|pom\.xml|package\.json|\.dockerignore) {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
