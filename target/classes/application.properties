spring.application.name=tool

# --- Database Configuration (Connecting to the Docker "db" service) ---
spring.datasource.url=jdbc:postgresql://db:5432/audit_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate Settings ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Migration Settings ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Server Port ---
server.port=8081

# --- Security Settings ---
security.jwt.secret=changeThisJwtSecretInProdToAtLeast32Chars
security.jwt.expiration=3600000

# --- Monitoring ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- App Settings ---
app.timezone=Asia/Kolkata

# --- Schedulers ---
scheduler.audit.overdue.cron=0 0 9 * * *
scheduler.audit.advance-alert.cron=0 0 10 * * *
scheduler.audit.weekly-summary.cron=0 0 11 * * MON

# --- Redis Configuration ---
spring.data.redis.host=redis
spring.data.redis.port=6379
