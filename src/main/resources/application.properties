spring.application.name=tool

# --- Database Configuration (Connecting to the Docker "db" service) ---
spring.datasource.url=jdbc:postgresql://db:5432/audit_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate Settings ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# --- Migration Settings ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Server Port ---
server.port=8081

# --- Security Settings ---
security.jwt.secret=changeThisJwtSecretInProdToAtLeast32Chars
security.jwt.expiration=3600000

# --- Monitoring ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- App Settings ---
app.timezone=Asia/Kolkata

# --- Schedulers ---
scheduler.audit.overdue.cron=0 0 9 * * *
scheduler.audit.advance-alert.cron=0 0 10 * * *
scheduler.audit.weekly-summary.cron=0 0 11 * * MON

# --- Redis Configuration ---
spring.data.redis.host=redis
spring.data.redis.port=6379

# --- SECURE COOKIE CONFIGURATION ---
# Enable HTTPS-only cookies (set to true in production with HTTPS)
server.servlet.session.cookie.secure=false
# Restrict cookie access to HTTP only (prevents JavaScript access)
server.servlet.session.cookie.http-only=true
# Set SameSite policy to prevent CSRF attacks (Strict is strongest)
server.servlet.session.cookie.same-site=strict
# Cookie timeout (30 minutes)
server.servlet.session.timeout=30m

# --- Swagger UI Settings ---
springdoc.swagger-ui.path=/swagger
server.forward-headers-strategy=framework

# --- DISABLE DANGEROUS FEATURES ---
# Disable H2 console auto configuration in production
spring.h2.console.enabled=false
# Enable query logging for security audits
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
